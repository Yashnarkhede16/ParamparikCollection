<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Paramparik Collection</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <span class="brand-main">Paramparik</span>
        <span class="brand-sub">Collection</span>
      </a>
      <button class="mobile-menu-btn" aria-label="Toggle Menu">☰</button>
      <nav class="nav-links">
        <a href="index.html" >Home</a>
        <a href="gallery.html" >Gallery</a>
        <a href="about.html" >About</a>
        <a href="login.html" class="active">Login</a>
        <a href="signup.html" class="btn-nav-signup">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <span class="pill-badge light">Welcome Back</span>
      <h1>Sign In</h1>
      <p class="auth-sub">Login to your Paramparik Collection account</p>
      <div class="diamond-divider" style="margin: 18px auto 24px;">✦</div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginMobile">Mobile Number</label>
          <div class="input-wrapper">
            <span class="input-icon">📞</span>
            <input
              type="tel"
              id="loginMobile"
              class="form-control"
              placeholder="Enter your mobile number"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="loginPassword"
              class="form-control"
              placeholder="Enter your password"
              required
            />
            <button type="button" class="toggle-password" aria-label="Toggle Password">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-whatsapp-submit">
          <span>💬</span> Login via WhatsApp
        </button>
      </form>

      <div class="diamond-divider" style="margin: 22px auto 14px;">✦</div>
      <p class="auth-switch">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
