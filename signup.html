<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Paramparik Collection</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <span class="brand-main">Paramparik</span>
        <span class="brand-sub">Collection</span>
      </a>
      <button class="mobile-menu-btn" aria-label="Toggle Menu">☰</button>
      <nav class="nav-links">
        <a href="index.html" >Home</a>
        <a href="gallery.html" >Gallery</a>
        <a href="about.html" >About</a>
        <a href="login.html" >Login</a>
        <a href="signup.html" class="btn-nav-signup active">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <span class="pill-badge light">Join Us</span>
      <h1>Create Account</h1>
      <p class="auth-sub">Register to explore Paramparik Collection's handcrafted jewellery</p>
      <div class="diamond-divider" style="margin: 18px auto 24px;">✦</div>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="signupName"
              class="form-control"
              placeholder="Enter your full name"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="signupAddress">Address</label>
          <div class="input-wrapper">
            <span class="input-icon" style="top: 14px;">📍</span>
            <textarea
              id="signupAddress"
              class="form-control"
              placeholder="Enter your full address"
              required
            ></textarea>
          </div>
        </div>

        <div class="form-group">
          <label for="signupMobile">Mobile Number</label>
          <div class="input-wrapper">
            <span class="input-icon">📞</span>
            <input
              type="tel"
              id="signupMobile"
              class="form-control"
              placeholder="Enter your 10-digit mobile number"
              pattern="[0-9]10"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="signupPassword"
              class="form-control"
              placeholder="Create a password (min 6 characters)"
              minlength="6"
              required
            />
            <button type="button" class="toggle-password" aria-label="Toggle Password">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label for="signupConfirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="signupConfirmPassword"
              class="form-control"
              placeholder="Re-enter your password"
              minlength="6"
              required
            />
            <button type="button" class="toggle-password" aria-label="Toggle Password">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-whatsapp-submit">
          <span>💬</span> Register via WhatsApp
        </button>
      </form>

      <div class="diamond-divider" style="margin: 22px auto 14px;">✦</div>
      <p class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
